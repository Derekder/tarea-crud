<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow">
      <div class="card-header bg-dark text-white text-center">
        <h4>Iniciar Sesión</h4>
      </div>
      <div class="card-body">
        <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" class="form-control" [(ngModel)]="username" placeholder="Usuario">
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" [(ngModel)]="password" placeholder="Contraseña">
        </div>
        <button class="btn btn-dark w-100 mb-3" (click)="login()">Ingresar</button>
        <p class="text-center mb-0">¿No tienes cuenta? <a routerLink="/registro">Registrarse</a></p>
      </div>
    </div>

    <div class="card mt-3 border-0" style="background: rgba(26,115,232,0.08); border-radius: 12px;">
      <div class="card-body py-3">
        <p class="mb-2 fw-bold" style="color: #1558b0;">🔑 Credenciales de prueba:</p>
        <p class="mb-1"><span class="badge" style="background:#1a73e8">SUPER-ADMIN</span> usuario: <strong>admin</strong> | contraseña: <strong>admin123</strong></p>
        <p class="mb-0"><span class="badge" style="background:#f57c00">USER</span> usuario: <strong>usuario</strong> | contraseña: <strong>user123</strong></p>
      </div>
    </div>
  </div>
</div>
