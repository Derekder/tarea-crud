<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow">
      <div class="card-header bg-dark text-white">
        <h4>{{ esEdicion ? 'Editar Producto' : 'Nuevo Producto' }}</h4>
      </div>
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" [(ngModel)]="producto.nombre" placeholder="Nombre">
        </div>
        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <textarea class="form-control" [(ngModel)]="producto.descripcion" placeholder="Descripción" rows="3"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Precio</label>
          <input type="number" class="form-control" [(ngModel)]="producto.precio" placeholder="Precio">
        </div>
        <div class="mb-3">
          <label class="form-label">Cantidad en Stock</label>
          <input type="number" class="form-control" [(ngModel)]="producto.cantidadStock" placeholder="Stock">
        </div>
        <div class="mb-3">
          <label class="form-label">Categoría</label>
          <select class="form-select" [(ngModel)]="producto.categoriaId">
            <option [value]="null">Seleccione una categoría</option>
            <option *ngFor="let cat of categorias" [value]="cat.id">{{ cat.nombre }}</option>
          </select>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-dark" (click)="guardar()">{{ esEdicion ? 'Actualizar' : 'Guardar' }}</button>
          <button class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
        </div>
      </div>
    </div>
  </div>
</div>
