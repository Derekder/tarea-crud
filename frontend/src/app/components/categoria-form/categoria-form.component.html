<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow">
      <div class="card-header bg-dark text-white">
        <h4>{{ esEdicion ? 'Editar Categoría' : 'Nueva Categoría' }}</h4>
      </div>
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" [(ngModel)]="categoria.nombre" placeholder="Nombre">
        </div>
        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <textarea class="form-control" [(ngModel)]="categoria.descripcion" placeholder="Descripción" rows="3"></textarea>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-dark" (click)="guardar()">{{ esEdicion ? 'Actualizar' : 'Guardar' }}</button>
          <button class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
        </div>
      </div>
    </div>
  </div>
</div>
