<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow">
      <div class="card-header bg-dark text-white text-center">
        <h4>Registro de Usuario</h4>
      </div>
      <div class="card-body">
        <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
        <div class="alert alert-success" *ngIf="exito">{{ exito }}</div>
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" class="form-control" [(ngModel)]="username" placeholder="Usuario">
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" [(ngModel)]="password" placeholder="Contraseña">
        </div>
        <div class="mb-3">
          <label class="form-label">Confirmar Contraseña</label>
          <input type="password" class="form-control" [(ngModel)]="confirmarPassword" placeholder="Confirmar Contraseña">
        </div>
        <button class="btn btn-dark w-100 mb-3" (click)="registrar()">Registrar</button>
        <p class="text-center mb-0">¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a></p>
      </div>
    </div>
  </div>
</div>
