<div class="mb-4">
  <h2>Usuarios</h2>
  <p class="text-muted mb-0">Listado de usuarios registrados en el sistema</p>
</div>

<div class="table-wrapper">
  <table class="table table-hover mb-0">
    <thead>
    <tr>
      <th>#</th>
      <th>Username</th>
      <th>Rol</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let usuario of usuarios">
      <td><span class="id-badge">{{ usuario.id }}</span></td>
      <td><strong>{{ usuario.username }}</strong></td>
      <td><span class="rol-badge" [ngClass]="usuario.rol?.nombre === 'SUPER-ADMIN-ROLE' ? 'rol-admin' : 'rol-user'">{{ usuario.rol?.nombre }}</span></td>
    </tr>
    </tbody>
  </table>
</div>
